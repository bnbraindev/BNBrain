services:
  bnbrain:
    build: .
    container_name: bnbrain
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./.logs/prod:/app/.logs/prod
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
